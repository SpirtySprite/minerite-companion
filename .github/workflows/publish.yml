name: Publish downloads and website
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check public content
        run: |
          test -f docs/documentation.html
          test -f docs/downloads.json
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile
          for path in Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file():
                  continue
              assert path.suffix != '.java', f'Unexpected loose source: {path}'
              sdk = path.parent == Path('docs/sdk') and re.fullmatch(r'minerite-companion-java-api-[0-9A-Za-z.+-]+(?:-sources)?\.jar', path.name)
              if path.name.endswith('sources.jar'):
                  assert sdk, f'Private source archive: {path}'
              if sdk:
                  with zipfile.ZipFile(path) as jar:
                      for entry in jar.infolist():
                          if entry.is_dir():
                              continue
                          allowed = entry.filename == 'META-INF/MANIFEST.MF' or re.fullmatch(r'fr/minerite/companion/api/Companion(?:Api|Addon)(?:\$[A-Za-z0-9]+)*\.(?:java|class)', entry.filename)
                          assert allowed, f'Non-API SDK content: {entry.filename}'
                          content = jar.read(entry)
                          assert b'kiru/swing' not in content and b'kiru.swing' not in content, f'Private implementation reference: {entry.filename}'
          print('Public SDK interfaces verified; private sources remain blocked')
          PY
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="minerite-companion-$VERSION+26.2.jar"
          test -f "docs/downloads/$FILE"
          test -f "release-notes/$VERSION.md"
          cd docs/downloads
          FILES=(minerite-companion-"$VERSION"+26.*.jar)
          sha256sum "${FILES[@]}" > "$RUNNER_TEMP/SHA256SUMS.txt"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$VERSION" == *-* && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(minor|major)-stable$ ]]; then
              gh release create "$GITHUB_REF_NAME" "${FILES[@]}" "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Minerite Companion $VERSION · Bêta" --notes-file "../../release-notes/$VERSION.md" --prerelease
            else
              gh release create "$GITHUB_REF_NAME" "${FILES[@]}" "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Minerite Companion $VERSION · Stable" --notes-file "../../release-notes/$VERSION.md" --latest
            fi
          fi
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs
  pages:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
